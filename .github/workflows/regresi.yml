name: Regresi IndoGhost

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regresi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Periksa TypeScript dan bangun aplikasi
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Uji pembuka dan regresi kampanye
        run: npm run test:e2e
